# Notices when the registry and this repo disagree.
#
# Manual releases rot silently: someone merges a version bump, the tag never
# gets pushed, and npm keeps serving the old build while the repo insists a new
# one exists. Nothing else in this repo would ever notice. The CLI repo carries
# a watchdog for the same class of failure.
name: npm-drift

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, early. A weekly cadence for a weekly-ish release rate.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Compare npm against the repo
        id: check
        run: |
          REPO="$(node -p "require('./packages/rendobar/package.json').version")"
          NPM="$(npm view @rendobar/piece-rendobar version 2>/dev/null || echo 'unpublished')"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM"   >> "$GITHUB_OUTPUT"
          if [ "$REPO" = "$NPM" ]; then
            echo "drift=none" >> "$GITHUB_OUTPUT"
          else
            echo "drift=yes"  >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$REPO npm=$NPM"

      - name: Open an issue when they disagree
        if: steps.check.outputs.drift == 'yes'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const repo = '${{ steps.check.outputs.repo }}';
            const npm  = '${{ steps.check.outputs.npm }}';
            const title = `npm is on ${npm}, this repo is on ${repo}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'release-drift',
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['release-drift'],
              body: [
                `\`packages/rendobar/package.json\` says **${repo}**.`,
                `\`npm view @rendobar/piece-rendobar version\` says **${npm}**.`,
                '',
                'Usually this means a release PR merged but its tag was never pushed,',
                'so the registry is still serving the previous build. Push the tag:',
                '',
                '```',
                `git tag v${repo} && git push origin v${repo}`,
                '```',
                '',
                'If the tag exists, check the publish workflow run for that tag.',
              ].join('\n'),
            });
