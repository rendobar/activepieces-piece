# Version bumps and the CHANGELOG, matching how rendobar/cli and rendobar/mcp
# release. It opens a release PR; merging that PR pushes the tag that
# publish.yml reacts to. Nothing publishes without a human merging.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:   # escape hatch for the documented silent-skip failure

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT, not GITHUB_TOKEN. GitHub deliberately does not fire workflows
          # for events pushed with GITHUB_TOKEN, so the release tag would be
          # created and publish.yml would never run. rendobar/mcp uses the same
          # secret for the same reason.
          token: ${{ secrets.ORG_AUTOMATION_PAT }}
